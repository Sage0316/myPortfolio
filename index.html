  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lex: 0 0 116px; font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }\n  .skill-items { font-size: 13px; color: var(--ink-soft); font-weight: 400; }\n\n  .proj { border: 1px solid var(--line); border-radius: 18px; background: var(--paper); margin-bottom: 10px; overflow: hidden; }\n  .proj.open { border-color: var(--accent); margin-bottom: 26px; }\n  .proj-head { display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; user-select: none; }\n  .proj-head:hover { background: var(--tint); }\n  .proj.open .proj-head { background: var(--tint); }\n  .proj-tag { flex: 0 0 74px; text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: var(--accent); padding: 4px 9px; border-radius: 9999px; }\n  .proj-title-wrap { flex: 1; min-width: 0; }\n  .proj-name { font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }\n  .proj-oneliner { font-size: 12.5px; color: var(--gray); margin-top: 4px; font-weight: 400; }\n  .proj-toggle { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-size: 15px; font-weight: 600; transition: transform .25s, background .18s, color .18s; }\n  .proj.open .proj-toggle { transform: rotate(45deg); background: var(--accent); color: #fff; }\n  .proj-body { max-height: 0; overflow: hidden; transition: max-height .4s ease; }\n  .proj.open .proj-body { max-height: 2800px; }\n  .proj-inner { padding: 2px 20px 18px; }\n  .proj-inner .lead { font-size: 13.5px; color: var(--ink); font-weight: 600; margin-top: 4px; margin-bottom: 12px; line-height: 1.6; }\n  .proj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }\n  @media (max-width: 760px){ .proj-grid { grid-template-columns: 1fr; } }\n  .proj-block { margin-bottom: 8px; }\n  .proj-block h4 { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-top: 10px; margin-bottom: 4px; }\n  .proj-block p { font-size: 12px; color: var(--ink-soft); line-height: 1.6; font-weight: 400; }\n  .proj-block ul { list-style: none; margin-top: 4px; }\n  .proj-block li { position: relative; padding-left: 13px; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 400; }\n  .proj-block li::before { content: \"–\"; position: absolute; left: 0; color: var(--accent); font-weight: 600; }\n  .stack-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }\n  .chip { font-size: 10px; color: var(--ink-soft); background: var(--tint); border: 1px solid var(--line); padding: 3px 8px; border-radius: 8px; font-weight: 400; }\n  .arch { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--parchment); overflow-x: auto; }\n  .arch svg { width: 100%; height: auto; display: block; }\n\n  .proj-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }\n  .proj-grid > div { display: block; }\n  .proj-block.arch { margin-top: 10px; }\n\n  .tl-item { display: grid; grid-template-columns: 124px 1fr; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); }\n  @media (max-width: 680px){ .tl-item { grid-template-columns: 1fr; gap: 4px; } }\n  .tl-date { font-size: 12px; color: var(--gray); font-weight: 400; padding-top: 2px; font-variant-numeric: tabular-nums; }\n  .tl-body h3 { font-size: 15px; font-weight: 600; color: var(--ink); }\n  .tl-body .tl-role { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-top: 1px; }\n  .tl-body ul { margin-top: 8px; list-style: none; }\n  .tl-body li { font-size: 12.5px; color: var(--ink-soft); padding-left: 13px; position: relative; margin-bottom: 3px; line-height: 1.6; font-weight: 400; }\n  .tl-body li::before { content: \"–\"; position: absolute; left: 0; color: var(--accent); font-weight: 600; }\n\n  .edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }\n  @media (max-width: 760px){ .edu-grid { grid-template-columns: 1fr; } }\n  .mini-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }\n  .mini-item .ml { color: var(--ink); font-weight: 400; }\n  .mini-item .mr { color: var(--gray); font-size: 12px; white-space: nowrap; }\n\n  .background-flow { display: grid; gap: 28px; }\n  .bg-group { padding-top: 2px; }\n  .bg-heading {\n    font-size: 17px;\n    font-weight: 600;\n    color: var(--ink);\n    letter-spacing: -0.01em;\n    margin-bottom: 12px;\n  }\n  .bg-sub {\n    font-size: 12.5px;\n    color: var(--gray);\n    margin-top: -4px;\n    margin-bottom: 12px;\n    font-weight: 400;\n  }\n  .bg-list { display: grid; gap: 12px; }\n  .bg-item {\n    padding: 0 0 12px;\n    border-bottom: 1px solid var(--line);\n  }\n  .bg-item-title {\n    display: flex;\n    justify-content: space-between;\n    gap: 16px;\n    align-items: baseline;\n    font-size: 14px;\n    font-weight: 400;\n    color: var(--ink);\n    line-height: 1.55;\n  }\n  .bg-item-meta {\n    flex: 0 0 auto;\n    font-size: 12px;\n    color: var(--gray);\n    font-weight: 400;\n    white-space: nowrap;\n  }\n  .bg-item-desc {\n    margin-top: 6px;\n    font-size: 12.8px;\n    color: var(--ink-soft);\n    line-height: 1.68;\n    font-weight: 400;\n  }\n  .bg-item-desc .dot {\n    display: block;\n    padding-left: 13px;\n    position: relative;\n    margin-top: 4px;\n  }\n  .bg-item-desc .dot::before {\n    content: \"–\";\n    position: absolute;\n    left: 0;\n    color: var(--accent);\n    font-weight: 600;\n  }\n  @media (max-width: 760px){\n    .bg-item-title { display: block; }\n    .bg-item-meta { display: block; margin-top: 4px; }\n  }\n\n  footer { padding: 38px 0 54px; text-align: center; color: var(--gray); font-size: 12px; font-weight: 400; }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n\n  <header class=\"hero\">\n    <div>\n      <div class=\"hero-eyebrow\">Human-Robot Interaction · AI Agent<\u002Fdiv>\n      <h1>윤지혜<\u002Fh1>\n      <div class=\"hero-tagline\">사람의 상태와 맥락을 해석해,<br>AI의 개입 타이밍을 설계하는 HRI / AI Agent 개발자<\u002Fdiv>\n      <p class=\"hero-intro\">상담심리학 석사와 EAP·조직 컨설팅 경력을 바탕으로, 사람의 행동 신호와 상호작용 맥락을 해석하는 역량을 쌓아왔습니다. 현재는 이를 HRI 시스템 설계와 AI Agent 구현으로 확장하며, 사용자가 먼저 입력하지 않아도 적절한 순간에 개입하는 Proactive Interaction 경험을 설계하고 있습니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"hero-meta\">\n      <b>Location<\u002Fb><span>Seoul, Korea<\u002Fspan>\n      <b>Phone<\u002Fb><span>010-8001-0316<\u002Fspan>\n      <b>Email<\u002Fb><span><a href=\"mailto:jihyeyun0316@gmail.com\">jihyeyun0316@gmail.com<\u002Fa><\u002Fspan>\n      <b>LinkedIn<\u002Fb><span><a href=\"https://www.linkedin.com/in/jihye-yun-b9a34b128\" target=\"_blank\" rel=\"noopener\">LinkedIn Profile<\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section>\n    <div class=\"sec-head\"><span class=\"sec-num\">01<\u002Fspan><span class=\"sec-title\">Profile<\u002Fspan><span class=\"sec-en\">about<\u002Fspan><\u002Fdiv>\n    <div class=\"profile-grid\">\n      <div>\n        <p>공공기관·민간기업 대상 EAP, HRD, 조직문화 프로젝트를 기획·운영하며 사람의 상태 변화와 개입 시점을 해석하는 역량을 축적했습니다. 요구 분석, 프로그램 구조 설계, 이해관계자 조율, 운영 흐름 개선을 반복하며 복잡한 맥락을 구조화하는 방식으로 일해왔습니다.<\u002Fp>\n        <p>현재는 AI Agent Development Bootcamp와 개인·팀 프로젝트를 통해 Python, OpenCV, MediaPipe, LangGraph, FastAPI, Next.js 기반 구현 경험을 확장하고 있습니다. 사용자 이해를 출발점으로 상호작용 구조를 설계하고, 이를 실제 프로토타입과 제품 흐름으로 연결하는 데 강점이 있습니다.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"quote\">사용자가 어떤 순간에 무엇을 필요로 하는지 먼저 파악하고, 그 흐름을 자연스러운 AI 상호작용으로 바꾸는 데 강점이 있습니다.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"tile-parchment\">\n    <div class=\"sec-head\"><span class=\"sec-num\">02<\u002Fspan><span class=\"sec-title\">Technical Skills<\u002Fspan><span class=\"sec-en\">skills<\u002Fspan><\u002Fdiv>\n    <div class=\"skill-grid\">\n      <div class=\"skill-row\"><div class=\"skill-cat\">HRI / Vision<\u002Fdiv><div class=\"skill-items\">OpenCV, MediaPipe, Context Management, HRI Scenario Design, Interaction Timing<\u002Fdiv><\u002Fdiv>\n      <div class=\"skill-row\"><div class=\"skill-cat\">AI Agent<\u002Fdiv><div class=\"skill-items\">LangGraph, LangChain, HITL, Realtime API, Agent Workflow, Prompt Engineering<\u002Fdiv><\u002Fdiv>\n      <div class=\"skill-row\"><div class=\"skill-cat\">Backend<\u002Fdiv><div class=\"skill-items\">Python, FastAPI, PostgreSQL, SQLAlchemy, REST API, PostGIS, pgvector<\u002Fdiv><\u002Fdiv>\n      <div class=\"skill-row\"><div class=\"skill-cat\">Frontend<\u002Fdiv><div class=\"skill-items\">Next.js, React, TypeScript, UI 구조 설계, QA, 상태값 정리<\u002Fdiv><\u002Fdiv>\n      <div class=\"skill-row\"><div class=\"skill-cat\">Research<\u002Fdiv><div class=\"skill-items\">심리 연구 설계, 성과 분석, 심리측정 도구 이해, 문서 구조화<\u002Fdiv><\u002Fdiv>\n      <div class=\"skill-row\"><div class=\"skill-cat\">Collaboration<\u002Fdiv><div class=\"skill-items\">이해관계자 조율, 프로젝트 운영, Git/GitHub, 기술-비기술 커뮤니케이션<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section>\n    <div class=\"sec-head\"><span class=\"sec-num\">03<\u002Fspan><span class=\"sec-title\">Projects<\u002Fspan><span class=\"sec-en\">portfolio · accordion<\u002Fspan><\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">Personal<\u002Fspan>\n        <div class=\"proj-title-wrap\">\n          <div class=\"proj-name\">EIRA — Physical AI Companion<\u002Fdiv>\n          <div class=\"proj-oneliner\">사용자의 입력 이전에 상태 신호를 해석해 먼저 상호작용을 시작하는 Proactive HRI 시스템<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <div class=\"lead\">EIRA는 자세·시선·움직임 등 관찰 가능한 물리적 신호를 해석해, 사용자가 먼저 말을 걸지 않아도 적절한 순간에 AI가 먼저 상호작용을 시작하는 Physical AI Companion 프로젝트입니다.<\u002Fdiv>\n        <div class=\"proj-grid\">\n          <div>\n            <div class=\"proj-block\"><h4>Role<\u002Fh4><ul>\n              <li>HRI 시나리오 설계<\u002Fli>\n              <li>Vision Input 파이프라인 구현<\u002Fli>\n              <li>Context 흐름 설계<\u002Fli>\n              <li>Interaction Decision 로직 설계<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"proj-block\"><h4>What I Built<\u002Fh4><ul>\n              <li>OpenCV·MediaPipe 기반 얼굴 방향, 상반신 자세, 움직임 변화 감지 파이프라인 구현<\u002Fli>\n              <li>단발 신호가 아닌 흐름 기반 판단을 위한 Context Manager 구조 설계<\u002Fli>\n              <li>피로·집중·이탈 상태 구분 기준 정의<\u002Fli>\n              <li>개입 타이밍 로직 설계 및 Realtime API 연동 구조 정리<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"proj-block\"><h4>Tech Stack<\u002Fh4><div class=\"stack-chips\"><span class=\"chip\">Python<\u002Fspan><span class=\"chip\">OpenCV<\u002Fspan><span class=\"chip\">MediaPipe<\u002Fspan><span class=\"chip\">OpenAI Realtime API<\u002Fspan><span class=\"chip\">HRI Scenario Design<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"proj-block\"><h4>System Flow<\u002Fh4>\n              <div class=\"arch\">\n<svg viewBox=\"0 0 960 720\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif\">\n  <defs>\n    <marker id=\"arr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"7\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#6B8080\"><\u002Fpath><\u002Fmarker>\n    <marker id=\"arrTeal\" markerWidth=\"10\" markerHeight=\"10\" refX=\"7\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#0066CC\"><\u002Fpath><\u002Fmarker>\n    <filter id=\"shadow\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"122%\"><feDropShadow dx=\"0\" dy=\"7\" stdDeviation=\"8\" flood-color=\"#1D1D1F\" flood-opacity=\"0.075\"><\u002FfeDropShadow><\u002Ffilter>\n    <linearGradient id=\"paper\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFFFFF\"><\u002Fstop><stop offset=\"1\" stop-color=\"#F6F9FD\"><\u002Fstop><\u002FlinearGradient>\n    <linearGradient id=\"teal\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2E7BD6\"><\u002Fstop><stop offset=\"1\" stop-color=\"#0B4A8F\"><\u002Fstop><\u002FlinearGradient>\n    <linearGradient id=\"mint\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F7FAFE\"><\u002Fstop><stop offset=\"1\" stop-color=\"#E9F1FC\"><\u002Fstop><\u002FlinearGradient>\n  <\u002Fdefs>\n\n  <rect width=\"960\" height=\"720\" fill=\"#F7FBFA\"><\u002Frect>\n  <rect x=\"20\" y=\"20\" width=\"920\" height=\"680\" rx=\"22\" fill=\"url(#paper)\" stroke=\"#D5E2E0\" stroke-width=\"1.4\" filter=\"url(#shadow)\"><\u002Frect>\n\n  <text x=\"50\" y=\"62\" font-size=\"22\" font-weight=\"800\" fill=\"#1D1D1F\">EIRA 기술스택 중심 구현 흐름<\u002Ftext>\n  <text x=\"50\" y=\"87\" font-size=\"11.5\" fill=\"#6B8080\">웹캠 입력부터 MediaPipe 랜드마크, CSV 기반 지표 집계, 규칙 분류, 캐릭터 UI 출력까지 이어지는 로컬 프로토타입 구조<\u002Ftext>\n\n  <rect x=\"620\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#0066CC\"><\u002Frect><text x=\"638\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">Vision<\u002Ftext>\n  <rect x=\"692\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#EAF2FC\" stroke=\"#0066CC\" stroke-width=\"1.2\"><\u002Frect><text x=\"710\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">Data<\u002Ftext>\n  <rect x=\"760\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.2\"><\u002Frect><text x=\"778\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">Logic<\u002Ftext>\n  <rect x=\"828\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#FFF7E6\" stroke=\"#E3B963\" stroke-width=\"1.2\"><\u002Frect><text x=\"846\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">Output<\u002Ftext>\n\n  <rect x=\"50\" y=\"112\" width=\"860\" height=\"54\" rx=\"13\" fill=\"#F4F7F6\" stroke=\"#D5E2E0\"><\u002Frect>\n  <text x=\"74\" y=\"136\" font-size=\"13\" fill=\"#1D1D1F\" font-weight=\"800\">Core Runtime<\u002Ftext>\n  <text x=\"74\" y=\"152\" font-size=\"10.5\" fill=\"#6B8080\">사용자 상태를 단정하지 않고, 관찰 가능한 변화 신호를 안정화해 캐릭터가 먼저 반응하는 흐름<\u002Ftext>\n  <text x=\"886\" y=\"144\" font-size=\"9.5\" fill=\"#0066CC\" font-weight=\"700\" text-anchor=\"end\">OpenCV → MediaPipe → Pandas/Rule → demo_ui<\u002Ftext>\n\n  <!-- row guide -->\n  <path d=\"M300 246 H350\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#arr)\"><\u002Fpath>\n  <path d=\"M610 246 H660\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#arr)\"><\u002Fpath>\n  <path d=\"M780 292 V322\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#arr)\"><\u002Fpath>\n  <path d=\"M660 384 H610\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#arr)\"><\u002Fpath>\n  <path d=\"M350 384 H300\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#arr)\"><\u002Fpath>\n  <path d=\"M180 430 C180 470, 260 486, 330 486\" fill=\"none\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#arr)\"><\u002Fpath>\n  <path d=\"M530 486 H590\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#arr)\"><\u002Fpath>\n\n  <!-- 01 -->\n  <rect x=\"60\" y=\"198\" width=\"240\" height=\"96\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"86\" cy=\"224\" r=\"14\" fill=\"#F4F7F6\" stroke=\"#D5E2E0\"><\u002Fcircle>\n  <rect x=\"78\" y=\"220\" width=\"16\" height=\"10\" rx=\"2\" fill=\"none\" stroke=\"#6B8080\" stroke-width=\"1.3\"><\u002Frect><circle cx=\"86\" cy=\"225\" r=\"3\" fill=\"none\" stroke=\"#6B8080\" stroke-width=\"1.3\"><\u002Fcircle>\n  <text x=\"110\" y=\"226\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1D1D1F\">OpenCV 입력<\u002Ftext>\n  <text x=\"110\" y=\"244\" font-size=\"9.2\" fill=\"#6B8080\" font-weight=\"700\">test_webcam.py<\u002Ftext>\n  <text x=\"78\" y=\"268\" font-size=\"10.3\" fill=\"#6B8080\">cv2.VideoCapture · 실시간 프레임 수집<\u002Ftext>\n  <text x=\"78\" y=\"284\" font-size=\"10.3\" fill=\"#6B8080\">웹캠 또는 테스트 영상 소스 연결<\u002Ftext>\n\n  <!-- 02 -->\n  <rect x=\"350\" y=\"188\" width=\"260\" height=\"116\" rx=\"14\" fill=\"url(#teal)\" stroke=\"#0066CC\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"378\" cy=\"216\" r=\"15\" fill=\"#DCEAFB\" opacity=\".22\"><\u002Fcircle>\n  <circle cx=\"373\" cy=\"212\" r=\"2\" fill=\"#DCEAFB\"><\u002Fcircle><circle cx=\"383\" cy=\"212\" r=\"2\" fill=\"#DCEAFB\"><\u002Fcircle><circle cx=\"378\" cy=\"224\" r=\"2\" fill=\"#DCEAFB\"><\u002Fcircle><path d=\"M373 212 L383 212 L378 224 Z\" fill=\"none\" stroke=\"#DCEAFB\" stroke-width=\"1\"><\u002Fpath>\n  <text x=\"404\" y=\"218\" font-size=\"13.5\" font-weight=\"800\" fill=\"#FFFFFF\">MediaPipe 랜드마크<\u002Ftext>\n  <text x=\"404\" y=\"236\" font-size=\"9.2\" fill=\"#B8D4F5\" font-weight=\"700\">FaceMesh + Pose<\u002Ftext>\n  <text x=\"372\" y=\"260\" font-size=\"10.3\" fill=\"#DCEAFB\">FaceMesh 478개 좌표 · Pose 33개 좌표<\u002Ftext>\n  <text x=\"372\" y=\"276\" font-size=\"10.3\" fill=\"#DCEAFB\">extract_landmarks.py<\u002Ftext>\n  <text x=\"372\" y=\"292\" font-size=\"10.3\" fill=\"#B8D4F5\">extract_pose_landmarks.py<\u002Ftext>\n\n  <!-- 03 -->\n  <rect x=\"660\" y=\"198\" width=\"240\" height=\"96\" rx=\"14\" fill=\"url(#mint)\" stroke=\"#0066CC\" stroke-width=\"1.35\"><\u002Frect>\n  <rect x=\"682\" y=\"220\" width=\"30\" height=\"24\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#8FB8E8\"><\u002Frect><line x1=\"688\" y1=\"228\" x2=\"706\" y2=\"228\" stroke=\"#0066CC\" stroke-width=\"1.1\"><\u002Fline><line x1=\"688\" y1=\"235\" x2=\"706\" y2=\"235\" stroke=\"#0066CC\" stroke-width=\"1.1\"><\u002Fline>\n  <text x=\"724\" y=\"226\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1D1D1F\">CSV 좌표 저장<\u002Ftext>\n  <text x=\"724\" y=\"244\" font-size=\"9.2\" fill=\"#0066CC\" font-weight=\"700\">data/*.csv<\u002Ftext>\n  <text x=\"682\" y=\"268\" font-size=\"10.3\" fill=\"#0066CC\">프레임별 landmark 좌표 기록<\u002Ftext>\n  <text x=\"682\" y=\"284\" font-size=\"10.3\" fill=\"#6B8080\">추후 분석/임계값 조정용 데이터<\u002Ftext>\n\n  <!-- 04 -->\n  <rect x=\"660\" y=\"322\" width=\"240\" height=\"96\" rx=\"14\" fill=\"url(#mint)\" stroke=\"#0066CC\" stroke-width=\"1.35\"><\u002Frect>\n  <text x=\"682\" y=\"350\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1D1D1F\">Pandas 특징 집계<\u002Ftext>\n  <text x=\"682\" y=\"368\" font-size=\"9.2\" fill=\"#0066CC\" font-weight=\"700\">summarize_pose_metrics.py<\u002Ftext>\n  <text x=\"682\" y=\"392\" font-size=\"10.3\" fill=\"#0066CC\">rolling window · baseline 보정<\u002Ftext>\n  <text x=\"682\" y=\"408\" font-size=\"10.3\" fill=\"#6B8080\">눈/입/눈썹/고개/어깨 지표 생성<\u002Ftext>\n\n  <!-- 05 -->\n  <rect x=\"350\" y=\"322\" width=\"260\" height=\"96\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.35\"><\u002Frect>\n  <text x=\"372\" y=\"350\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1D1D1F\">Rule 기반 상태 분류<\u002Ftext>\n  <text x=\"372\" y=\"368\" font-size=\"9.2\" fill=\"#6B8080\" font-weight=\"700\">classify_state.py<\u002Ftext>\n  <text x=\"372\" y=\"392\" font-size=\"10.3\" fill=\"#6B8080\">positive · fatigued · low_mood 신호<\u002Ftext>\n  <text x=\"372\" y=\"408\" font-size=\"10.3\" fill=\"#6B8080\">감정 확정이 아닌 변화 패턴 추정<\u002Ftext>\n\n  <!-- 06 -->\n  <rect x=\"60\" y=\"322\" width=\"240\" height=\"96\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.35\"><\u002Frect>\n  <text x=\"82\" y=\"350\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1D1D1F\">Signal Guard<\u002Ftext>\n  <text x=\"82\" y=\"368\" font-size=\"9.2\" fill=\"#6B8080\" font-weight=\"700\">stability logic<\u002Ftext>\n  <text x=\"82\" y=\"392\" font-size=\"10.3\" fill=\"#6B8080\">깜빡임 방지 · 상태 유지<\u002Ftext>\n  <text x=\"82\" y=\"408\" font-size=\"10.3\" fill=\"#6B8080\">확신 낮은 프레임은 출력 억제<\u002Ftext>\n\n  <!-- 07/08 output -->\n  <rect x=\"330\" y=\"454\" width=\"200\" height=\"92\" rx=\"14\" fill=\"#FFF7E6\" stroke=\"#E3B963\" stroke-width=\"1.35\"><\u002Frect>\n  <text x=\"352\" y=\"483\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1D1D1F\">demo_ui 출력<\u002Ftext>\n  <text x=\"352\" y=\"501\" font-size=\"9.2\" fill=\"#9A6A00\" font-weight=\"700\">Tkinter · PIL · assets<\u002Ftext>\n  <text x=\"352\" y=\"525\" font-size=\"10.3\" fill=\"#6B8080\">캐릭터 얼굴/입 이미지 합성<\u002Ftext>\n  <text x=\"352\" y=\"541\" font-size=\"10.3\" fill=\"#6B8080\">상태 문구 실시간 표시<\u002Ftext>\n\n  <rect x=\"590\" y=\"454\" width=\"250\" height=\"92\" rx=\"14\" fill=\"#FFF7E6\" stroke=\"#E3B963\" stroke-width=\"1.35\"><\u002Frect>\n  <text x=\"612\" y=\"483\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1D1D1F\">선제 상호작용<\u002Ftext>\n  <text x=\"612\" y=\"501\" font-size=\"9.2\" fill=\"#9A6A00\" font-weight=\"700\">Proactive prompt<\u002Ftext>\n  <text x=\"612\" y=\"525\" font-size=\"10.3\" fill=\"#6B8080\">“조금 지쳐 보여요”처럼 질문형 반응<\u002Ftext>\n  <text x=\"612\" y=\"541\" font-size=\"10.3\" fill=\"#6B8080\">사용자 입력을 기다리지 않는 AI 경험<\u002Ftext>\n\n  <!-- bottom strip -->\n  <rect x=\"60\" y=\"588\" width=\"840\" height=\"50\" rx=\"12\" fill=\"#F4F7F6\" stroke=\"#D5E2E0\"><\u002Frect>\n  <text x=\"82\" y=\"610\" font-size=\"11.3\" fill=\"#1D1D1F\" font-weight=\"800\">Offline Test Loop<\u002Ftext>\n  <text x=\"82\" y=\"628\" font-size=\"10\" fill=\"#6B8080\">MOV 샘플 영상 → landmark CSV → pose metrics → rule tuning → 실시간 웹캠 데모 반영<\u002Ftext>\n  <text x=\"878\" y=\"620\" font-size=\"10\" fill=\"#0066CC\" font-weight=\"700\" text-anchor=\"end\">Python · OpenCV · MediaPipe · Pandas · Tkinter/PIL<\u002Ftext>\n\n  <text x=\"480\" y=\"670\" font-size=\"10.8\" fill=\"#0066CC\" font-weight=\"700\" text-anchor=\"middle\">EIRA Core: 관찰 신호 기반으로 사용자가 먼저 입력하지 않아도 조심스럽게 다가오는 Physical AI Interaction<\u002Ftext>\n<\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">Personal<\u002Fspan>\n        <div class=\"proj-title-wrap\">\n          <div class=\"proj-name\">하꾸(HAKKU) — AI Daily Video Journal <span style=\"font-size:11px;font-weight:600;color:var(--accent);letter-spacing:0;\">(2026년 앱스토어 출시 예정)<\u002Fspan><\u002Fdiv>\n          <div class=\"proj-oneliner\">하루의 기록을 AI가 해석해 감정 결을 입힌 영상으로 만들어 주는, 로컬 우선 개인 기록 PWA<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <div class=\"lead\">하꾸는 하루 동안 남긴 글·사진·음성·짧은 영상을 모아 한 편의 영상으로 만들어 주는 개인 기록 앱입니다. AI는 무드·제목·자막·배경음악을 정하는 연출가 역할만 맡고 미디어 원본은 기기를 떠나지 않으며, 사용자가 그 해석을 조정하면 즉시 결과물에 반영됩니다. 기획·설계·구현·배포·운영을 혼자 수행한 개인 프로젝트입니다.<\u002Fdiv>\n        <div class=\"proj-grid\">\n          <div>\n            <div class=\"proj-block\"><h4>Role<\u002Fh4><ul>\n              <li>기획 · 제품 설계<\u002Fli>\n              <li>UX · IA 설계<\u002Fli>\n              <li>프론트엔드 구현<\u002Fli>\n              <li>AI 연출 파이프라인 설계<\u002Fli>\n              <li>서버리스 백엔드<\u002Fli>\n              <li>배포 · 운영 자동화<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"proj-block\"><h4>What I Built<\u002Fh4><ul>\n              <li>하루 기록 → AI 연출 → 영상 생성 → 아카이브로 이어지는 제품 전체 흐름 설계<\u002Fli>\n              <li>Canvas로 1080×1920 장면을 그리고 MediaRecorder로 인코딩하는 클라이언트 영상 생성 파이프라인 구현 (배경음악·음성 믹싱, 더킹, 페이드 포함)<\u002Fli>\n              <li>AI 응답을 캐시 키 5요소(설치 ID·날짜·기록 해시·감정 강도·프롬프트 버전)로 관리하고 동시 요청을 합쳐 API 호출 비용을 통제하는 구조 설계<\u002Fli>\n              <li>API 키를 브라우저에 두지 않기 위해 프롬프트·검증·rate limit을 전부 Cloudflare Worker로 분리, 설치 토큰 기반 인증 구현<\u002Fli>\n              <li>로컬 우선 데이터 설계 — 미디어 원본은 IndexedDB, 메타데이터는 Zod 스키마 검증 후 localStorage. AI에는 텍스트와 캡션만 전송<\u002Fli>\n              <li>하루가 넘어갈 때 기록이 유실되던 버그를 추적해 아카이브 이관 로직으로 데이터 보존 경로 재설계, 회귀 테스트로 고정<\u002Fli>\n              <li>GitHub Actions 기반 CI/CD 구축 — 무결성 해시 검증 후 배포, 워커 URL 누락 시 배포 차단 가드<\u002Fli>\n              <li>iOS 실기기 검증을 통해 웹앱 특유의 제약 대응 (오디오 컨텍스트 제스처 요구, 코덱 호환성, 입력창 자동 확대 등)<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"proj-block\"><h4>Scale<\u002Fh4><ul>\n              <li>애플리케이션·워커 소스 약 7,200줄 (테스트 제외)<\u002Fli>\n              <li>자동화 테스트 68개 + E2E · 접근성 검사<\u002Fli>\n              <li>서버리스 워커 3종 (AI 연출 / 웹 푸시 / 미디어 배포)<\u002Fli>\n              <li>배경음악 21곡 (전곡 CC0, 라이선스 근거 확인 완료)<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"proj-block\"><h4>Tech Stack<\u002Fh4><div class=\"stack-chips\"><span class=\"chip\">React 19<\u002Fspan><span class=\"chip\">TypeScript<\u002Fspan><span class=\"chip\">Vite<\u002Fspan><span class=\"chip\">PWA<\u002Fspan><span class=\"chip\">Canvas API<\u002Fspan><span class=\"chip\">MediaRecorder<\u002Fspan><span class=\"chip\">Web Audio API<\u002Fspan><span class=\"chip\">IndexedDB<\u002Fspan><span class=\"chip\">Cloudflare Workers<\u002Fspan><span class=\"chip\">KV · R2<\u002Fspan><span class=\"chip\">AI Gateway<\u002Fspan><span class=\"chip\">Claude<\u002Fspan><span class=\"chip\">Vitest<\u002Fspan><span class=\"chip\">Playwright<\u002Fspan><span class=\"chip\">GitHub Actions<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"proj-block\"><h4>System Flow<\u002Fh4>\n              <div class=\"arch\">\n<svg viewBox=\"0 0 960 760\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif\">\n  <defs>\n    <marker id=\"hkArr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"7\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#6B8080\"><\u002Fpath><\u002Fmarker>\n    <filter id=\"hkShadow\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"122%\"><feDropShadow dx=\"0\" dy=\"7\" stdDeviation=\"8\" flood-color=\"#1D1D1F\" flood-opacity=\"0.075\"><\u002FfeDropShadow><\u002Ffilter>\n    <linearGradient id=\"hkPaper\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFFFFF\"><\u002Fstop><stop offset=\"1\" stop-color=\"#F6F9FD\"><\u002Fstop><\u002FlinearGradient>\n    <linearGradient id=\"hkSky\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3FA0E0\"><\u002Fstop><stop offset=\"1\" stop-color=\"#12507F\"><\u002Fstop><\u002FlinearGradient>\n  <\u002Fdefs>\n\n  <rect width=\"960\" height=\"760\" fill=\"#F7FBFA\"><\u002Frect>\n  <rect x=\"20\" y=\"20\" width=\"920\" height=\"720\" rx=\"22\" fill=\"url(#hkPaper)\" stroke=\"#D5E2E0\" stroke-width=\"1.4\" filter=\"url(#hkShadow)\"><\u002Frect>\n\n  <text x=\"50\" y=\"62\" font-size=\"22\" font-weight=\"800\" fill=\"#000000\">하꾸 기술스택 중심 구현 흐름<\u002Ftext>\n  <text x=\"50\" y=\"87\" font-size=\"11.5\" fill=\"#6B8080\">하루 기록 수집부터 서버리스 AI 연출, 사용자 조정, 브라우저 영상 생성, 아카이브 저장까지 이어지는 로컬 우선 구조<\u002Ftext>\n\n  <rect x=\"596\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#3FA0E0\"><\u002Frect><text x=\"614\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">Device<\u002Ftext>\n  <rect x=\"676\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#E9F1FC\" stroke=\"#3FA0E0\" stroke-width=\"1.2\"><\u002Frect><text x=\"694\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">Worker<\u002Ftext>\n  <rect x=\"760\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.2\"><\u002Frect><text x=\"778\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">User<\u002Ftext>\n  <rect x=\"828\" y=\"49\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#FFF7E6\" stroke=\"#E3B963\" stroke-width=\"1.2\"><\u002Frect><text x=\"846\" y=\"60\" font-size=\"10\" fill=\"#333333\" font-weight=\"600\">Output<\u002Ftext>\n\n  <rect x=\"50\" y=\"112\" width=\"860\" height=\"54\" rx=\"13\" fill=\"#F4F7F6\" stroke=\"#D5E2E0\"><\u002Frect>\n  <text x=\"74\" y=\"136\" font-size=\"13\" fill=\"#000000\" font-weight=\"800\">Local-first Runtime<\u002Ftext>\n  <text x=\"74\" y=\"152\" font-size=\"10.5\" fill=\"#6B8080\">미디어 원본은 기기에 남고, AI에는 텍스트와 캡션만 전송해 해석만 위임하는 흐름<\u002Ftext>\n  <text x=\"886\" y=\"144\" font-size=\"9.5\" fill=\"#3FA0E0\" font-weight=\"700\" text-anchor=\"end\">IndexedDB → Worker → Claude → Canvas<\u002Ftext>\n\n  <path d=\"M480 250 V286\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#hkArr)\"><\u002Fpath>\n  <path d=\"M480 372 V408\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#hkArr)\"><\u002Fpath>\n  <path d=\"M480 476 V512\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#hkArr)\"><\u002Fpath>\n  <path d=\"M480 580 V616\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#hkArr)\"><\u002Fpath>\n  <path d=\"M480 684 V706\" stroke=\"#6B8080\" stroke-width=\"1.35\" marker-end=\"url(#hkArr)\"><\u002Fpath>\n\n  <rect x=\"120\" y=\"188\" width=\"720\" height=\"62\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"152\" cy=\"219\" r=\"13\" fill=\"#E9F1FC\" stroke=\"#3FA0E0\" stroke-width=\"1.2\"><\u002Fcircle><text x=\"152\" y=\"224\" font-size=\"11\" font-weight=\"800\" fill=\"#3FA0E0\" text-anchor=\"middle\">1<\u002Ftext>\n  <text x=\"180\" y=\"214\" font-size=\"13\" font-weight=\"800\" fill=\"#000000\">하루 기록 수집<\u002Ftext>\n  <text x=\"180\" y=\"234\" font-size=\"10.3\" fill=\"#6B8080\">글 · 사진 · 앨범 · 음성 · 짧은 영상 → 원본은 IndexedDB, 메타데이터만 localStorage<\u002Ftext>\n\n  <rect x=\"120\" y=\"286\" width=\"720\" height=\"62\" rx=\"14\" fill=\"url(#hkSky)\" stroke=\"#3FA0E0\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"152\" cy=\"317\" r=\"13\" fill=\"#FFFFFF\" opacity=\".28\"><\u002Fcircle><text x=\"152\" y=\"322\" font-size=\"11\" font-weight=\"800\" fill=\"#FFFFFF\" text-anchor=\"middle\">2<\u002Ftext>\n  <text x=\"180\" y=\"312\" font-size=\"13\" font-weight=\"800\" fill=\"#FFFFFF\">AI 연출 요청 (사용자 동의 후)<\u002Ftext>\n  <text x=\"180\" y=\"332\" font-size=\"10.3\" fill=\"#DCEAFB\">텍스트와 캡션만 전송 · 미디어 원본 제외 → 설치 토큰(HMAC) 인증 · 일일 호출 제한<\u002Ftext>\n\n  <rect x=\"120\" y=\"384\" width=\"720\" height=\"62\" rx=\"14\" fill=\"#E9F1FC\" stroke=\"#3FA0E0\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"152\" cy=\"415\" r=\"13\" fill=\"#FFFFFF\" stroke=\"#3FA0E0\" stroke-width=\"1.2\"><\u002Fcircle><text x=\"152\" y=\"420\" font-size=\"11\" font-weight=\"800\" fill=\"#3FA0E0\" text-anchor=\"middle\">3<\u002Ftext>\n  <text x=\"180\" y=\"410\" font-size=\"13\" font-weight=\"800\" fill=\"#000000\">Worker에서 프롬프트 구성 · 모델 호출<\u002Ftext>\n  <text x=\"180\" y=\"430\" font-size=\"10.3\" fill=\"#6B8080\">Cloudflare Worker → AI Gateway → Claude → 응답 스키마 검증 후 반환<\u002Ftext>\n\n  <rect x=\"120\" y=\"452\" width=\"720\" height=\"52\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"152\" cy=\"478\" r=\"13\" fill=\"#E9F1FC\" stroke=\"#3FA0E0\" stroke-width=\"1.2\"><\u002Fcircle><text x=\"152\" y=\"483\" font-size=\"11\" font-weight=\"800\" fill=\"#3FA0E0\" text-anchor=\"middle\">4<\u002Ftext>\n  <text x=\"180\" y=\"474\" font-size=\"13\" font-weight=\"800\" fill=\"#000000\">연출 결과 수신<\u002Ftext>\n  <text x=\"180\" y=\"492\" font-size=\"10.3\" fill=\"#6B8080\">제목 · 마무리 문장 · 무드 · 이모지 · 장면 자막 · BGM 무드<\u002Ftext>\n\n  <rect x=\"120\" y=\"512\" width=\"720\" height=\"62\" rx=\"14\" fill=\"#FFF7E6\" stroke=\"#E3B963\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"152\" cy=\"543\" r=\"13\" fill=\"#FFFFFF\" stroke=\"#E3B963\" stroke-width=\"1.2\"><\u002Fcircle><text x=\"152\" y=\"548\" font-size=\"11\" font-weight=\"800\" fill=\"#B8853A\" text-anchor=\"middle\">5<\u002Ftext>\n  <text x=\"180\" y=\"538\" font-size=\"13\" font-weight=\"800\" fill=\"#000000\">사용자 조정<\u002Ftext>\n  <text x=\"180\" y=\"558\" font-size=\"10.3\" fill=\"#6B8080\">이모지 선택 · 감정 강도 조절 → 조정값이 캐시 키에 포함되어 같은 조건은 재호출 없이 재사용<\u002Ftext>\n\n  <rect x=\"120\" y=\"616\" width=\"720\" height=\"62\" rx=\"14\" fill=\"url(#hkSky)\" stroke=\"#3FA0E0\" stroke-width=\"1.35\"><\u002Frect>\n  <circle cx=\"152\" cy=\"647\" r=\"13\" fill=\"#FFFFFF\" opacity=\".28\"><\u002Fcircle><text x=\"152\" y=\"652\" font-size=\"11\" font-weight=\"800\" fill=\"#FFFFFF\" text-anchor=\"middle\">6<\u002Ftext>\n  <text x=\"180\" y=\"642\" font-size=\"13\" font-weight=\"800\" fill=\"#FFFFFF\">영상 생성 (전부 브라우저에서)<\u002Ftext>\n  <text x=\"180\" y=\"662\" font-size=\"10.3\" fill=\"#DCEAFB\">Canvas 1080×1920 렌더링 + BGM/음성 믹싱 → MediaRecorder 인코딩 · mp4 우선<\u002Ftext>\n\n  <rect x=\"120\" y=\"706\" width=\"720\" height=\"14\" rx=\"7\" fill=\"#F4F7F6\" stroke=\"#D5E2E0\"><\u002Frect>\n  <text x=\"480\" y=\"716\" font-size=\"9.6\" fill=\"#6B8080\" text-anchor=\"middle\" font-weight=\"700\">7 · 아카이브 저장 — 완성 영상은 IndexedDB · 하루 하나 정책<\u002Ftext>\n<\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"proj-block\"><h4>의의<\u002Fh4>\n              <p>사용자가 스스로 정리하지 않아도 AI가 먼저 하루를 해석해 제시하고, 사람이 그 해석을 조정하는 상호작용을 개인 기록 도메인에 적용한 개인 프로젝트<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">Team<\u002Fspan>\n        <div class=\"proj-title-wrap\">\n          <div class=\"proj-name\">KIRA — ESG Supply Chain AI Platform <span style=\"font-size:11px;font-weight:600;color:var(--accent);letter-spacing:0;\">(부트캠프 최우수상)<\u002Fspan><\u002Fdiv>\n          <div class=\"proj-oneliner\">EV 배터리 공급망 실사, 규제 검토, DPP 발행을 지원하는 LangGraph 기반 AI Agent 플랫폼<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <div class=\"lead\">KIRA는 EV 배터리 공급망 실사와 규제 검토, DPP 발행을 지원하는 AI Agent 플랫폼입니다. 제품 중심 공급망 구조 재설계, HITL 분기 흐름 설계, Audit 백엔드 개발, 프론트엔드 재구성까지 수행한 팀 프로젝트입니다.<\u002Fdiv>\n        <div class=\"proj-grid\">\n          <div>\n            <div class=\"proj-block\"><h4>Role<\u002Fh4><ul>\n              <li>IA 설계<\u002Fli>\n              <li>Audit 도메인 백엔드 개발<\u002Fli>\n              <li>프론트엔드 재구성<\u002Fli>\n              <li>Agent 흐름 검증, QA 및 배포 수행<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"proj-block\"><h4>What I Built<\u002Fh4><ul>\n              <li>협력사 중심 구조를 제품 중심 공급망 구조로 재설계<\u002Fli>\n              <li>7-tier 공급망 매핑 및 규제 검토 흐름 연결<\u002Fli>\n              <li>확신이 낮은 판정의 HITL 검토 분기 구조 설계<\u002Fli>\n              <li>PostGIS 기반 geo_audit 기능 구현<\u002Fli>\n              <li>Audit, User, Report, Batch 도메인 FastAPI 백엔드 개발<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"proj-block\"><h4>Tech Stack<\u002Fh4><div class=\"stack-chips\"><span class=\"chip\">FastAPI<\u002Fspan><span class=\"chip\">LangGraph<\u002Fspan><span class=\"chip\">PostgreSQL<\u002Fspan><span class=\"chip\">PostGIS<\u002Fspan><span class=\"chip\">pgvector<\u002Fspan><span class=\"chip\">Next.js<\u002Fspan><span class=\"chip\">AWS<\u002Fspan><span class=\"chip\">Docker<\u002Fspan><span class=\"chip\">Vercel<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"proj-block\"><h4>Agent Pipeline<\u002Fh4>\n              <div class=\"arch\">\n<svg viewBox=\"0 0 720 560\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\">\n      <defs>\n        <marker id=\"arr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\">\n          <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#6B8080\"><\u002Fpath>\n        <\u002Fmarker>\n      <\u002Fdefs>\n\n      <!-- legend -->\n      <rect x=\"20\" y=\"16\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#0066CC\"><\u002Frect>\n      <text x=\"40\" y=\"28\" font-size=\"10\" fill=\"#333333\">AI 사용<\u002Ftext>\n      <rect x=\"104\" y=\"16\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"124\" y=\"28\" font-size=\"10\" fill=\"#333333\">결정론 · 규칙 기반<\u002Ftext>\n      <rect x=\"232\" y=\"16\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#FFF7E6\" stroke=\"#E3B963\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"252\" y=\"28\" font-size=\"10\" fill=\"#333333\">HITL · 담당자 검토<\u002Ftext>\n      <text x=\"700\" y=\"28\" font-size=\"9.5\" fill=\"#0066CC\" text-anchor=\"end\" font-weight=\"600\">KIRA 내부 ESG 공급망 추적·검증 흐름<\u002Ftext>\n\n      <!-- start -->\n      <rect x=\"20\" y=\"46\" width=\"680\" height=\"50\" rx=\"9\" fill=\"#F4F7F6\" stroke=\"#D5E2E0\"><\u002Frect>\n      <text x=\"36\" y=\"66\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1D1D1F\">KIRA 제품 M-BOM 기준 설정<\u002Ftext>\n      <text x=\"36\" y=\"82\" font-size=\"9\" fill=\"#6B8080\">배터리 완성품 → 부품 · 자재 · 원재료 추적 기준 정의<\u002Ftext>\n\n      <!-- supplier input -->\n      <line x1=\"360\" y1=\"96\" x2=\"360\" y2=\"114\" stroke=\"#6B8080\" stroke-width=\"1.4\" marker-end=\"url(#arr)\"><\u002Fline>\n      <rect x=\"80\" y=\"114\" width=\"560\" height=\"54\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"98\" y=\"135\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1D1D1F\">협력사 공급망 데이터 제출<\u002Ftext>\n      <text x=\"600\" y=\"135\" font-size=\"8.8\" fill=\"#6B8080\" text-anchor=\"end\">Supplier Input<\u002Ftext>\n      <text x=\"98\" y=\"153\" font-size=\"9\" fill=\"#6B8080\">납품 품목 · 생산 사업장 · 하위 자재 · 하위 협력사 · 원산지 · 증빙자료<\u002Ftext>\n\n      <!-- n-tier trace -->\n      <line x1=\"360\" y1=\"168\" x2=\"360\" y2=\"186\" stroke=\"#6B8080\" stroke-width=\"1.4\" marker-end=\"url(#arr)\"><\u002Fline>\n      <rect x=\"80\" y=\"186\" width=\"560\" height=\"54\" rx=\"9\" fill=\"#EAF2FC\" stroke=\"#0066CC\" stroke-width=\"1.2\"><\u002Frect>\n      <text x=\"98\" y=\"207\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1D1D1F\">N차 공급망 맵 확장<\u002Ftext>\n      <text x=\"600\" y=\"207\" font-size=\"8.8\" fill=\"#0066CC\" text-anchor=\"end\">Traceability<\u002Ftext>\n      <text x=\"98\" y=\"225\" font-size=\"9\" fill=\"#0066CC\">상위 협력사가 하위 협력사를 호출하며 자재-공급사-사업장 관계를 단계적으로 연결<\u002Ftext>\n\n      <!-- document ai -->\n      <line x1=\"360\" y1=\"240\" x2=\"360\" y2=\"258\" stroke=\"#6B8080\" stroke-width=\"1.4\" marker-end=\"url(#arr)\"><\u002Fline>\n      <rect x=\"120\" y=\"258\" width=\"480\" height=\"62\" rx=\"9\" fill=\"#0066CC\"><\u002Frect>\n      <text x=\"138\" y=\"279\" font-size=\"11.5\" font-weight=\"700\" fill=\"#FFFFFF\">data_gateway · 증빙자료 추출<\u002Ftext>\n      <text x=\"560\" y=\"279\" font-size=\"8.8\" fill=\"#B8D4F5\" text-anchor=\"end\">AI · Bedrock<\u002Ftext>\n      <text x=\"138\" y=\"297\" font-size=\"9\" fill=\"#DCEAFB\">Claude 멀티모달 추출 — PDF/이미지/엑셀 → structured JSON<\u002Ftext>\n      <text x=\"138\" y=\"312\" font-size=\"9\" fill=\"#8FB8E8\">parsed_fields · confidence_map · evidence_metadata 생성<\u002Ftext>\n\n      <!-- DB -->\n      <line x1=\"360\" y1=\"320\" x2=\"360\" y2=\"338\" stroke=\"#6B8080\" stroke-width=\"1.4\" marker-end=\"url(#arr)\"><\u002Fline>\n      <rect x=\"20\" y=\"338\" width=\"680\" height=\"42\" rx=\"9\" fill=\"#EAF2FC\" stroke=\"#0066CC\" stroke-width=\"1.2\"><\u002Frect>\n      <text x=\"36\" y=\"358\" font-size=\"11\" font-weight=\"700\" fill=\"#1D1D1F\">PostgreSQL · PostGIS · pgvector<\u002Ftext>\n      <text x=\"36\" y=\"373\" font-size=\"8.8\" fill=\"#0066CC\">공급망 관계 · 사업장 위치 · 규제 근거 · 문서 추출값 · 리스크 이력 저장<\u002Ftext>\n\n      <!-- router -->\n      <line x1=\"360\" y1=\"380\" x2=\"360\" y2=\"398\" stroke=\"#6B8080\" stroke-width=\"1.4\" marker-end=\"url(#arr)\"><\u002Fline>\n      <rect x=\"180\" y=\"398\" width=\"360\" height=\"42\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"360\" y=\"417\" font-size=\"10.8\" font-weight=\"700\" fill=\"#1D1D1F\" text-anchor=\"middle\">supervisor.route() · 검증 라우터<\u002Ftext>\n      <text x=\"360\" y=\"432\" font-size=\"8.8\" fill=\"#6B8080\" text-anchor=\"middle\">stage · confidence · risk flag 기준으로 검증 노드 분기<\u002Ftext>\n\n      <!-- three validation nodes -->\n      <line x1=\"360\" y1=\"440\" x2=\"360\" y2=\"456\" stroke=\"#6B8080\" stroke-width=\"1.3\"><\u002Fline>\n      <line x1=\"128\" y1=\"456\" x2=\"592\" y2=\"456\" stroke=\"#6B8080\" stroke-width=\"1.3\"><\u002Fline>\n      <line x1=\"128\" y1=\"456\" x2=\"128\" y2=\"472\" stroke=\"#6B8080\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"><\u002Fline>\n      <line x1=\"360\" y1=\"456\" x2=\"360\" y2=\"472\" stroke=\"#6B8080\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"><\u002Fline>\n      <line x1=\"592\" y1=\"456\" x2=\"592\" y2=\"472\" stroke=\"#6B8080\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"><\u002Fline>\n\n      <rect x=\"20\" y=\"472\" width=\"216\" height=\"64\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"36\" y=\"493\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1D1D1F\">geo_audit<\u002Ftext>\n      <text x=\"220\" y=\"493\" font-size=\"8.5\" fill=\"#6B8080\" text-anchor=\"end\">Rule<\u002Ftext>\n      <text x=\"36\" y=\"511\" font-size=\"8.8\" fill=\"#6B8080\">사업장 · 원산국 · 공급경로<\u002Ftext>\n      <text x=\"36\" y=\"525\" font-size=\"8.8\" fill=\"#6B8080\">고위험 국가/지역 여부 검증<\u002Ftext>\n\n      <rect x=\"252\" y=\"472\" width=\"216\" height=\"64\" rx=\"9\" fill=\"#0066CC\"><\u002Frect>\n      <text x=\"268\" y=\"493\" font-size=\"10.5\" font-weight=\"700\" fill=\"#FFFFFF\">compliance<\u002Ftext>\n      <text x=\"452\" y=\"493\" font-size=\"8.5\" fill=\"#B8D4F5\" text-anchor=\"end\">AI · RAG<\u002Ftext>\n      <text x=\"268\" y=\"511\" font-size=\"8.8\" fill=\"#DCEAFB\">규제 문서 검색 + 근거 조항 대조<\u002Ftext>\n      <text x=\"268\" y=\"525\" font-size=\"8.8\" fill=\"#DCEAFB\">FEOC · UFLPA 등 리스크 판정<\u002Ftext>\n\n      <rect x=\"484\" y=\"472\" width=\"216\" height=\"64\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#B8C4CC\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"500\" y=\"493\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1D1D1F\">risk_scoring<\u002Ftext>\n      <text x=\"684\" y=\"493\" font-size=\"8.5\" fill=\"#6B8080\" text-anchor=\"end\">Rule<\u002Ftext>\n      <text x=\"500\" y=\"511\" font-size=\"8.8\" fill=\"#6B8080\">규제 위반 · 지역 리스크 · 경고<\u002Ftext>\n      <text x=\"500\" y=\"525\" font-size=\"8.8\" fill=\"#6B8080\">점수화 후 risk_level 산정<\u002Ftext>\n\n      <!-- bottom output -->\n      <line x1=\"128\" y1=\"536\" x2=\"128\" y2=\"548\" stroke=\"#6B8080\" stroke-width=\"1.2\"><\u002Fline>\n      <line x1=\"360\" y1=\"536\" x2=\"360\" y2=\"548\" stroke=\"#6B8080\" stroke-width=\"1.2\"><\u002Fline>\n      <line x1=\"592\" y1=\"536\" x2=\"592\" y2=\"548\" stroke=\"#6B8080\" stroke-width=\"1.2\"><\u002Fline>\n      <line x1=\"128\" y1=\"548\" x2=\"592\" y2=\"548\" stroke=\"#6B8080\" stroke-width=\"1.2\"><\u002Fline>\n      <line x1=\"360\" y1=\"548\" x2=\"360\" y2=\"560\" stroke=\"#6B8080\" stroke-width=\"1.2\"><\u002Fline>\n    <\u002Fsvg>\n\n    <svg viewBox=\"0 0 720 132\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\">\n      <defs>\n        <marker id=\"arr2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\">\n          <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#6B8080\"><\u002Fpath>\n        <\u002Fmarker>\n      <\u002Fdefs>\n\n      <line x1=\"360\" y1=\"0\" x2=\"360\" y2=\"16\" stroke=\"#6B8080\" stroke-width=\"1.4\" marker-end=\"url(#arr2)\"><\u002Fline>\n\n      <rect x=\"80\" y=\"16\" width=\"260\" height=\"66\" rx=\"9\" fill=\"#FFF7E6\" stroke=\"#E3B963\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"98\" y=\"38\" font-size=\"11\" font-weight=\"700\" fill=\"#1D1D1F\">HITL · 보완요청<\u002Ftext>\n      <text x=\"314\" y=\"38\" font-size=\"8.6\" fill=\"#9A6A00\" text-anchor=\"end\">High Risk<\u002Ftext>\n      <text x=\"98\" y=\"56\" font-size=\"8.8\" fill=\"#6B8080\">critical/high risk 또는 증빙 불충분 시<\u002Ftext>\n      <text x=\"98\" y=\"70\" font-size=\"8.8\" fill=\"#6B8080\">담당자 검토 · 협력사 재제출 요청<\u002Ftext>\n\n      <line x1=\"340\" y1=\"49\" x2=\"380\" y2=\"49\" stroke=\"#6B8080\" stroke-width=\"1.4\" marker-end=\"url(#arr2)\"><\u002Fline>\n\n      <rect x=\"380\" y=\"16\" width=\"260\" height=\"66\" rx=\"9\" fill=\"#EAF2FC\" stroke=\"#0066CC\" stroke-width=\"1.3\"><\u002Frect>\n      <text x=\"398\" y=\"38\" font-size=\"11\" font-weight=\"700\" fill=\"#1D1D1F\">Verified Supply Chain<\u002Ftext>\n      <text x=\"614\" y=\"38\" font-size=\"8.6\" fill=\"#0066CC\" text-anchor=\"end\">Output<\u002Ftext>\n      <text x=\"398\" y=\"56\" font-size=\"8.8\" fill=\"#0066CC\">제품별 공급망 맵 · 리스크 현황<\u002Ftext>\n      <text x=\"398\" y=\"70\" font-size=\"8.8\" fill=\"#0066CC\">규제 대응 근거 · 감사 추적 이력 관리<\u002Ftext>\n\n      <rect x=\"20\" y=\"98\" width=\"680\" height=\"24\" rx=\"6\" fill=\"#F4F7F6\" stroke=\"#D5E2E0\"><\u002Frect>\n      <text x=\"360\" y=\"114\" font-size=\"9.2\" fill=\"#333333\" text-anchor=\"middle\" font-weight=\"600\">\n        M-BOM → 협력사 제출 → N차 공급망 확장 → 증빙 추출 → Geo/RAG 검증 → Risk Scoring → HITL/검증 완료\n      <\u002Ftext>\n    <\u002Fsvg>\n              <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fsection>\n\n  <section class=\"tile-parchment\">\n    <div class=\"sec-head\"><span class=\"sec-num\">04<\u002Fspan><span class=\"sec-title\">Experience<\u002Fspan><span class=\"sec-en\">career<\u002Fspan><\u002Fdiv>\n    <div class=\"tl-item\">\n      <div class=\"tl-date\">2025.11 – 2025.12<\u002Fdiv>\n      <div class=\"tl-body\">\n        <h3>홈플러스<\u002Fh3>\n        <div class=\"tl-role\">이커머스 · 선임 프리랜서<\u002Fdiv>\n        <ul>\n          <li>이커머스 운영 및 사업 관련 단기 프로젝트 수행<\u002Fli>\n          <li>운영 프로세스 지원 및 실무 자료 정리<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tl-item\">\n      <div class=\"tl-date\">2025.09<\u002Fdiv>\n      <div class=\"tl-body\">\n        <h3>에스넷<\u002Fh3>\n        <div class=\"tl-role\">교육운영팀 · 과장 프리랜서<\u002Fdiv>\n        <ul>\n          <li>교육 운영, 제안서 기획, 사업 문서 구조화 수행<\u002Fli>\n          <li>이해관계자 커뮤니케이션 지원<\u002Fli>\n          <li>군 전역 예정 장병 대상 신규 이러닝 사업 제안의 핵심 기획 및 문서화 기여<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tl-item\">\n      <div class=\"tl-date\">2020.01 – 2024.10<\u002Fdiv>\n      <div class=\"tl-body\">\n        <h3>다인<\u002Fh3>\n        <div class=\"tl-role\">EAP 사업팀 · 수석 컨설턴트<\u002Fdiv>\n        <ul>\n          <li>공공기관·민간기업 대상 EAP, HRD, 조직문화 프로젝트 기획 및 운영<\u002Fli>\n          <li>조직 진단, 리더십, 갈등관리, 임직원 지원 프로그램 설계<\u002Fli>\n          <li>이해관계자 요구 분석, 프로그램 구조 설계, 운영 흐름 설계<\u002Fli>\n          <li>성과 분석, 보고서 작성, 문서 구조화 수행<\u002Fli>\n          <li>해양경찰청, 대법원, 기업은행, GS칼텍스 등 다수 기업 제안서 작성<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tl-item\">\n      <div class=\"tl-date\">2019.02 – 2019.12<\u002Fdiv>\n      <div class=\"tl-body\">\n        <h3>기독교세계관학술동역회<\u002Fh3>\n        <div class=\"tl-role\">간사<\u002Fdiv>\n        <ul>\n          <li>학술지·격월간지 발간 지원<\u002Fli>\n          <li>학술대회 기획·운영, 행사 홍보 및 커뮤니케이션 지원<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  \n  <section style=\"padding-bottom:24px;\">\n    <div class=\"sec-head\"><span class=\"sec-num\">05<\u002Fspan><span class=\"sec-title\">Background<\u002Fspan><span class=\"sec-en\">education<\u002Fspan><\u002Fdiv>\n    <div class=\"background-flow\">\n\n      <div class=\"bg-group\">\n        <div class=\"bg-heading\">Education<\u002Fdiv>\n        <div class=\"bg-list\">\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>한동대학교 일반대학원 심리학과 · 석사<\u002Fspan>\n              <span class=\"bg-item-meta\">2016.09 – 2019.02<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>한동대학교 상담심리사회복지학부 · 학사<\u002Fspan>\n              <span class=\"bg-item-meta\">2010.03 – 2016.07<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"bg-group\">\n        <div class=\"bg-heading\">Graduate Research<\u002Fdiv>\n        <div class=\"bg-sub\">대학원 과정 중 수행 및 참여 연구<\u002Fdiv>\n        <div class=\"bg-list\">\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>여성의 자아존중감이 음식중독에 미치는 영향: 스트레스의 매개효과<\u002Fspan>\n              <span class=\"bg-item-meta\">Thesis<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>예일음식중독척도 2.0(Yale Food Addiction Scale 2.0) 국내 타당화 연구<\u002Fspan>\n              <span class=\"bg-item-meta\">Research<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>청소년 인터넷·스마트폰 과의존 상담·치유 프로그램 성과분석 및 평가지표 개발<\u002Fspan>\n              <span class=\"bg-item-meta\">Research<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>스마트폰 선용 역량 구축 모델 개발<\u002Fspan>\n              <span class=\"bg-item-meta\">Research<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"bg-group\">\n        <div class=\"bg-heading\">[삼정] ESG 데이터 활용 AX Academy with AI Agent<\u002Fdiv>\n        <div class=\"bg-sub\">삼정회계법인 · 1,040 Hours · Full-Stack / AI Agent / Cloud &amp; DevOps / ESG Domain<\u002Fdiv>\n        <div class=\"bg-list\">\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>Full-Stack · React · Next.js · Python · FastAPI · Database<\u002Fspan>\n              <span class=\"bg-item-meta\">Bootcamp<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>AI Agent Engineering · LLM · LangChain · LangGraph · RAG<\u002Fspan>\n              <span class=\"bg-item-meta\">Bootcamp<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>Cloud &amp; DevOps · AWS · Docker · Kubernetes · CI/CD<\u002Fspan>\n              <span class=\"bg-item-meta\">Bootcamp<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>ESG Domain · Supply Chain ESG · Carbon Emissions · CBAM · ESG Data Analytics<\u002Fspan>\n              <span class=\"bg-item-meta\">Bootcamp<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"bg-group\">\n        <div class=\"bg-heading\">Certificates<\u002Fdiv>\n        <div class=\"bg-list\">\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>전문상담사 2급<\u002Fspan>\n              <span class=\"bg-item-meta\">2020.01<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bg-item\">\n            <div class=\"bg-item-title\">\n              <span>TOEIC Speaking IH<\u002Fspan>\n              <span class=\"bg-item-meta\">2025.06<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n\n  <section class=\"tile-parchment\">\n    <div class=\"sec-head\"><span class=\"sec-num\">06<\u002Fspan><span class=\"sec-title\">자기소개서<\u002Fspan><span class=\"sec-en\">cover letter<\u002Fspan><\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">01<\u002Fspan>\n        <div class=\"proj-title-wrap\"><div class=\"proj-name\">직무 전환 계기<\u002Fdiv><\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <p style=\"font-size:12pt;color:var(--ink-soft);line-height:1.8;font-weight:400;\">사람의 마음과 조직의 변화를 함께 이해하고 싶다는 관심은 학부에서 상담심리학과 사회복지학을 복수전공하고, 이후 대학원에서 심리학을 전공하는 과정으로 이어졌습니다. 개인의 심리와 관계를 이해하는 공부를 하면서도, 실제 현장에서는 개인만이 아니라 조직과 시스템이 함께 바뀌어야 지속적인 변화가 가능하다는 점을 체감했습니다. 이러한 관심은 이후 공공기관과 민간기업을 대상으로 EAP, 조직문화, 교육 프로그램을 기획·운영하는 커리어로 확장되었습니다. 최근에는 사람 중심 관점을 기술과 연결하는 일에 관심을 두며 AI Agent와 HRI 분야를 학습하고 있습니다. 사람을 이해하는 기반 위에서 기술을 설계하는 것이 저의 커리어를 관통하는 핵심 가치입니다.<\u002Fp>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">02<\u002Fspan>\n        <div class=\"proj-title-wrap\"><div class=\"proj-name\">갈등 해결 경험<\u002Fdiv><\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <p style=\"font-size:12pt;color:var(--ink-soft);line-height:1.8;font-weight:400;\">프로젝트를 운영하다 보면 고객사, 내부 실무진, 외부 강사 및 상담사 간 요구사항이 서로 다른 경우가 많았습니다. 저는 먼저 각 이해관계자의 입장을 분리해서 정리하고, 무엇이 반드시 충족되어야 하는 핵심 조건인지 우선순위를 재설정하는 방식으로 갈등을 해결해왔습니다. 예를 들어 일정, 예산, 운영 방식에서 의견 차이가 발생했을 때 각자의 요구를 그대로 전달하는 데 그치지 않고, 공통 목표를 기준으로 조율 가능한 대안을 제시했습니다. 그 결과 일정 변경이나 운영 수정이 필요한 상황에서도 프로젝트가 중단 없이 진행될 수 있었고, 고객사의 신뢰를 유지할 수 있었습니다. 이 경험을 통해 갈등은 피하는 대상이 아니라 구조화하고 조정해야 하는 문제라는 점을 배웠습니다.<\u002Fp>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">03<\u002Fspan>\n        <div class=\"proj-title-wrap\"><div class=\"proj-name\">핵심역량을 통한 직무 수행<\u002Fdiv><\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <p style=\"font-size:12pt;color:var(--ink-soft);line-height:1.8;font-weight:400;\">약 5년간 공공기관 및 민간기업 대상 EAP, HRD, 조직문화 프로젝트를 수행하며 고객사의 조직 이슈와 요구를 분석하고, 이를 제안서, 프로그램 기획, 운영 구조, 성과 개선 방향으로 구체화해왔습니다. 단순한 요청 수행에 그치지 않고 고객사가 실제로 해결하고자 하는 문제와 현장의 제약을 함께 파악하며, 다양한 이해관계자를 조율해 실행 가능한 해결안을 만드는 경험을 쌓았습니다. 최근에는 AI Agent Bootcamp와 ESG 공급망 프로젝트를 통해 이러한 역량을 기술 기반 프로젝트로 확장하고 있으며, 복잡한 도메인과 업무 흐름을 사용자가 이해하기 쉬운 IA/UX 구조로 설계하고 구현하는 경험을 했습니다. 이처럼 저는 고객사와 사용자의 니즈를 정확히 읽고, 이를 실행 가능한 서비스 구조와 결과물로 연결하는 데 강점이 있습니다.<\u002Fp>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">04<\u002Fspan>\n        <div class=\"proj-title-wrap\"><div class=\"proj-name\">문제 해결 경험<\u002Fdiv><\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <p style=\"font-size:12pt;color:var(--ink-soft);line-height:1.8;font-weight:400;\">ESG 공급망 프로젝트에서 가장 큰 문제는 복잡한 공급망 구조와 업무 흐름이 사용자에게 직관적으로 보이지 않는다는 점이었습니다. 저는 실제 담당자의 업무 시나리오를 다시 정의하고, 제품 중심으로 정보 구조를 재배치해 공급망 맵과 My Task 화면의 IA/UX 흐름을 재설계했습니다. 또한 통합 작업 큐 조회 API, audit trail 검증, HITL 재개 흐름 등 백엔드 기능과 화면 요구사항이 맞물리도록 상태값과 데이터 흐름을 정리했으며, Tenant·User 중복 정의와 Product ORM 에러 등 도메인 정합성 문제도 발견해 수정 방향을 잡았습니다. 이를 통해 복잡한 도메인을 사용자가 이해하고 처리할 수 있는 업무 흐름으로 재구성했고, 기술 구현은 사용자 문제를 정확히 분석해 서비스 구조와 연결될 때 더 큰 문제 해결로 이어진다는 점을 배웠습니다.<\u002Fp>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"proj\" data-proj=\"\">\n      <div class=\"proj-head\">\n        <span class=\"proj-tag\">05<\u002Fspan>\n        <div class=\"proj-title-wrap\"><div class=\"proj-name\">지원 동기 및 입사 후 포부<\u002Fdiv><\u002Fdiv>\n        <div class=\"proj-toggle\">+<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-body\"><div class=\"proj-inner\">\n        <p style=\"font-size:12pt;color:var(--ink-soft);line-height:1.8;font-weight:400;\">저는 사람에 대한 이해를 기반으로 기술을 설계하는 일에 큰 매력을 느끼고 있습니다. 기존 커리어에서 조직과 구성원의 문제를 진단하고, 이를 프로그램과 구조로 설계하는 경험을 해왔다면, 앞으로는 이를 AI Agent와 HRI, 사용자 중심 서비스 설계 영역으로 확장하고 싶습니다. 특히 사람의 상태와 맥락을 이해하고 반응하는 인터랙션 설계, 복잡한 문제를 구조화하는 능력, 실제 사용 흐름을 반영한 서비스 설계 역량을 함께 발전시키고자 합니다. 입사 후에는 먼저 조직과 서비스의 문제를 빠르게 이해하고, 사용자 관점에서 구조를 정리하며, 필요한 기술 역량을 빠르게 흡수하는 구성원이 되고 싶습니다. 장기적으로는 사람 중심 AI 경험을 설계하는 HRI/AI Agent 전문가로 성장하고 싶습니다.<\u002Fp>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer class=\"tile-parchment\" style=\"text-align:center;color:var(--gray);font-size:12px;padding-top:38px;padding-bottom:54px;\">윤지혜 · HRI / AI Agent Resume<\u002Ffooter>\n<\u002Fdiv>\n\n<script>\n  document.querySelectorAll('[data-proj]').forEach((proj) => {\n    const head = proj.querySelector('.proj-head');\n    head.addEventListener('click', () => proj.classList.toggle('open'));\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
